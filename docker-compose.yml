services:
  dsa-tracker:
    build: .
    container_name: dsa-tracker
    restart: unless-stopped
    user: root
    ports:
      - "3210:3210"
    volumes:
      # Persists dsa.db (all accounts, progress, settings and keys) on the host.
      # The database is created automatically on first run.
      - ./data:/data
    environment:
      - PORT=3210
      - DSA_DATA_DIR=/data
      # Google OAuth credentials — set these in a .env file (never commit it).
      # Register <APP_URL>/auth/google/callback as an authorized redirect URI.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Set when running behind a proxy/custom domain.
      - APP_URL=${APP_URL:-}
    healthcheck:
      # /api/auth/me needs no session, so it is a safe liveness probe.
      test: ["CMD", "wget", "-qO-", "http://localhost:3210/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
