<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playlist Progress — DSA Studio</title>
<script src="/auth.js?v=2"></script>
<style>
:root{color-scheme:dark;--bg:#020203;--surface:#101015;--line:rgba(255,255,255,.1);--text:#f7f7fa;--muted:#9898a6;--primary:#8b7cff;--green:#45dfa0;--amber:#f7c45c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(95,76,220,.12),transparent 32rem),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(2,2,3,.8)}.brand{font-weight:800;text-decoration:none;color:var(--text)}.brand span{color:var(--primary)}.nav{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:7px 11px;border-radius:9px}.wrap{max-width:1180px;margin:auto;padding:34px 22px 80px}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#b2a9ff;font-weight:800}h1{margin:5px 0 5px;font-size:30px;letter-spacing:-.04em}.sub{color:var(--muted);margin:0 0 26px}.playlist{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(145deg,rgba(20,20,26,.85),rgba(8,8,11,.75));margin:18px 0}.head{display:flex;align-items:center;gap:15px;padding:18px 20px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:17px}.meta{color:var(--muted);font-size:12px}.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);width:180px;margin-left:auto;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8b7cff,#4de3df)}.count{font-weight:700;font-size:12px;min-width:52px}table{width:100%;border-collapse:collapse}th,td{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.055);text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}tr:last-child td{border:0}.thumb{width:64px;height:36px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:10px}.video-title{font-weight:650}.tag{display:inline-block;border-radius:99px;padding:3px 8px;font-size:10px;font-weight:800;text-transform:uppercase;background:rgba(255,255,255,.07);color:var(--muted)}.tag.completed{color:var(--green);background:rgba(69,223,160,.12)}.tag.attempted{color:var(--amber);background:rgba(247,196,92,.12)}button{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font:11px inherit;padding:6px 8px;cursor:pointer;margin-right:5px}button:hover{border-color:var(--primary)}button.active{background:var(--text);color:#070708}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}@media(max-width:700px){.top{padding:0 16px}.wrap{padding:24px 12px}.head{flex-wrap:wrap}.bar{margin-left:0;width:100%}th:nth-child(3),td:nth-child(3){display:none}th,td{padding:10px}.actions{min-width:200px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/">DSA <span>Studio</span></a><a class="nav" href="/">← Dashboard</a></header>
<main class="wrap"><div class="eyebrow">Video learning</div><h1>Playlist progress</h1><p class="sub">Every playlist video, its state, revisions, and whether it is in today’s active plan.</p><div id="content" class="empty">Loading playlists…</div></main>
<script>
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function videoUrl(playlist,video){if(video.videoId)return `https://www.youtube.com/watch?v=${encodeURIComponent(video.videoId)}&list=${encodeURIComponent(new URL(playlist.url).searchParams.get('list')||'')}&index=${video.position}`;try{const url=new URL(playlist.url);url.searchParams.set('index',video.position);return url.toString()}catch{return playlist.url}}
async function api(path,opts){const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function update(btn,status,revision){btn.disabled=true;try{await api('/api/video-progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playlistId:btn.dataset.playlist,position:Number(btn.dataset.position),...(status?{status}:{revision})})});load()}catch(e){alert(e.message)}finally{btn.disabled=false}}
async function load(){try{const data=await api('/api/playlists/progress');const content=document.getElementById('content');if(!data.playlists.length){content.className='empty';content.textContent='No playlists have been added yet.';return}content.className='';content.innerHTML=data.playlists.map(p=>{const pct=p.totalVideos?Math.round(p.done/p.totalVideos*100):0;return `<section class="playlist"><div class="head"><div><h2>${esc(p.title)}</h2><div class="meta">${p.totalVideos} videos · ${p.targetDays}-day target</div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="count">${p.done}/${p.totalVideos}</div></div><div style="overflow:auto"><table><thead><tr><th>#</th><th>Video</th><th>Plan</th><th>Status</th><th>Actions</th></tr></thead><tbody>${p.videos.map(v=>`<tr><td>${v.position}</td><td><a href="${esc(videoUrl(p,v))}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${v.thumbnail?`<img class="thumb" src="${esc(v.thumbnail)}" alt="">`:''}<span class="video-title">${esc(v.title)} ↗</span></a></td><td>${v.inTodayPlan?'<span class="tag">Today</span>':'—'}</td><td><span class="tag ${esc(v.status)}">${esc(v.status)}</span>${v.revision?' <span class="tag">revision</span>':''}</td><td class="actions"><button class="${v.status==='completed'?'active':''}" data-playlist="${esc(p.id)}" data-position="${v.position}" data-status="completed">Watched</button><button class="${v.status==='attempted'?'active':''}" data-playlist="${esc(p.id)}" data-position="${v.position}" data-status="attempted">Continue</button><button class="${v.revision?'active':''}" data-playlist="${esc(p.id)}" data-position="${v.position}" data-revision="${v.revision?'1':'0'}">Revise</button></td></tr>`).join('')}</tbody></table></div></section>`}).join('');content.querySelectorAll('[data-playlist]').forEach(btn=>btn.onclick=()=>update(btn,btn.dataset.status,btn.dataset.revision!=='1'))}catch(e){document.getElementById('content').textContent='Failed to load: '+e.message}}
load();
</script>
</body>
</html>
