<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2Z Sheet — DSA Tracker</title>
<style>
  :root {
    --bg: #0c0c0b;
    --surface: #141413;
    --surface-2: #1c1c1b;
    --surface-3: #242422;
    --ink: #e8e7e2;
    --ink-2: #a09f99;
    --muted: #5a5955;
    --border: rgba(255,255,255,0.06);
    --border-2: rgba(255,255,255,0.04);
    --accent: #f97316;
    --accent-dim: rgba(249,115,22,0.15);
    --good: #22c55e;
    --warn: #f59e0b;
    --critical: #ef4444;
    --header-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13.5px/1.5 "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  /* ── Topbar ── */
  .topbar {
    height: var(--header-h); flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-logo { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
  .topbar-logo span { color: var(--accent); }
  .topbar-sub { font-size: 12px; color: var(--muted); }
  .nav-link {
    font: 600 12px system-ui, sans-serif; color: var(--muted);
    text-decoration: none; padding: 5px 11px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.08); transition: all .15s;
  }
  .nav-link:hover { color: var(--ink); border-color: var(--muted); }
  .nav-link.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .filter-bar input[type="search"] {
    flex: 1; min-width: 180px; max-width: 320px;
    padding: 6px 12px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.08); background: var(--surface-2);
    color: var(--ink); font: 13px system-ui, sans-serif;
  }
  .filter-bar input[type="search"]:focus { outline: none; border-color: var(--accent); }
  .filter-bar input[type="search"]::placeholder { color: var(--muted); }
  .filter-bar select {
    padding: 6px 10px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.08); background: var(--surface-2);
    color: var(--ink); font: 13px system-ui, sans-serif; cursor: pointer;
  }
  .filter-bar select:focus { outline: none; border-color: var(--accent); }
  .filter-count { font-size: 12px; color: var(--muted); margin-left: auto; }
  .filter-stats { display: flex; gap: 16px; font-size: 12px; margin-left: auto; }
  .filter-stat { color: var(--muted); }
  .filter-stat strong { color: var(--ink-2); font-weight: 600; }

  /* ── Scroll container ── */
  .sheet-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .sheet-wrap::-webkit-scrollbar { width: 5px; }
  .sheet-wrap::-webkit-scrollbar-track { background: transparent; }
  .sheet-wrap::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; }

  /* ── Step group ── */
  .step-group { border-bottom: 1px solid var(--border); }

  .step-header {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 20px; cursor: pointer;
    user-select: none; position: sticky; top: 0; z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .step-header:hover { background: var(--surface-2); }
  .step-chevron {
    width: 16px; height: 16px; flex-shrink: 0;
    color: var(--muted); transition: transform .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .step-header.open .step-chevron { transform: rotate(90deg); }
  .step-name { font-size: 14px; font-weight: 700; color: var(--ink); flex: 1; }
  .step-prog-wrap { display: flex; align-items: center; gap: 10px; }
  .step-prog-bar { width: 120px; height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
  .step-prog-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .4s ease; }
  .step-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── Subsection ── */
  .subsection { }
  .subsection.hidden { display: none; }

  .sub-header {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 20px 9px 40px; cursor: pointer;
    user-select: none; background: var(--surface-2);
    border-bottom: 1px solid var(--border-2);
    transition: background .1s;
  }
  .sub-header:hover { background: var(--surface-3); }
  .sub-chevron {
    width: 12px; height: 12px; flex-shrink: 0;
    color: var(--muted); transition: transform .2s;
    display: flex; align-items: center; justify-content: center; font-size: 9px;
  }
  .sub-header.open .sub-chevron { transform: rotate(90deg); }
  .sub-name { font-size: 12.5px; font-weight: 600; color: var(--ink-2); flex: 1; }
  .sub-prog-bar { width: 80px; height: 3px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
  .sub-prog-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .4s ease; }
  .sub-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── Table inside subsection ── */
  .sub-table-wrap { background: var(--bg); }
  .sub-table-wrap.hidden { display: none; }

  table { width: 100%; border-collapse: collapse; }
  .table-header-row {
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .table-header-row th {
    padding: 7px 14px; text-align: left;
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border-2);
    transition: background .08s;
  }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child { border-bottom: none; }

  td { padding: 10px 14px; vertical-align: middle; }

  /* Status checkbox cell */
  .td-status { width: 48px; text-align: center; padding: 10px 8px; }
  .status-btn {
    width: 22px; height: 22px; border-radius: 5px; border: none;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s; position: relative; background: transparent; padding: 0;
  }
  .status-btn:focus { outline: none; }

  /* Status icons */
  .status-icon { width: 20px; height: 20px; border-radius: 4px; }
  .status-icon.pending {
    border: 2px solid var(--muted); background: transparent;
  }
  .status-icon.pending:hover { border-color: var(--accent); }
  .status-icon.attempted {
    border: 2px solid var(--warn); background: transparent;
    position: relative;
  }
  .status-icon.completed, .status-icon.solved_with_help {
    background: var(--accent); border: 2px solid var(--accent);
  }
  .status-icon.revision_needed {
    background: transparent; border: 2px solid var(--accent);
  }
  .checkmark {
    width: 10px; height: 8px;
    border-left: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translate(1px, -1px);
    display: none;
  }
  .status-icon.completed .checkmark,
  .status-icon.solved_with_help .checkmark { display: block; }

  /* help dot for solved_with_help */
  .status-icon.solved_with_help {
    background: var(--accent); opacity: .7;
  }

  /* revision star */
  .rev-star { font-size: 11px; color: var(--accent); }

  /* attempt dash */
  .att-dash { width: 8px; height: 2px; background: var(--warn); border-radius: 99px; }

  /* Problem name */
  .td-title { min-width: 200px; max-width: 380px; }
  .problem-name { font-weight: 500; color: var(--ink); font-size: 13.5px; }
  .problem-name.done { color: var(--ink-2); }

  /* Solve link */
  .td-solve { width: 70px; }
  .solve-link {
    font-size: 12.5px; font-weight: 600; color: var(--accent);
    text-decoration: none; transition: opacity .15s;
  }
  .solve-link:hover { opacity: .7; }
  .solve-dash { color: var(--muted); font-size: 12px; }

  /* Resource icons */
  .td-res { width: 100px; }
  .res-links { display: flex; gap: 6px; align-items: center; }
  .res-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 20px; border-radius: 4px;
    font-size: 11px; font-weight: 700; text-decoration: none;
    transition: opacity .15s; letter-spacing: -.01em;
  }
  .res-icon:hover { opacity: .8; }
  .res-icon.yt { background: #ff0000; color: #fff; font-size: 9px; }
  .res-icon.tuf { background: var(--accent); color: #fff; font-size: 9px; }
  .res-icon.lc { background: #ffa116; color: #fff; font-size: 9px; }
  .res-none { color: var(--muted); font-size: 12px; }

  /* Difficulty */
  .td-diff { width: 88px; }
  .diff {
    display: inline-block; padding: 2px 10px; border-radius: 99px;
    font-size: 11.5px; font-weight: 600;
  }
  .diff-Easy { color: var(--good); border: 1px solid rgba(34,197,94,.25); background: rgba(34,197,94,.08); }
  .diff-Medium { color: var(--warn); border: 1px solid rgba(245,158,11,.25); background: rgba(245,158,11,.08); }
  .diff-Hard { color: var(--critical); border: 1px solid rgba(239,68,68,.25); background: rgba(239,68,68,.08); }

  /* Status dropdown popover */
  .status-popover {
    position: fixed; z-index: 100;
    background: var(--surface-2); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.6);
    padding: 6px; min-width: 180px;
    display: none; flex-direction: column; gap: 2px;
  }
  .status-popover.visible { display: flex; }
  .status-option {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 7px; cursor: pointer;
    font-size: 13px; color: var(--ink-2); transition: background .1s;
  }
  .status-option:hover { background: var(--surface-3); color: var(--ink); }
  .status-option.selected { color: var(--ink); background: var(--surface-3); }
  .status-option .opt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Empty state */
  .empty { padding: 80px 20px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">DSA <span>Tracker</span></div>
    <div class="topbar-sub">Striver A2Z</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <a href="/" class="nav-link">Dashboard</a>
    <a href="/sheet.html" class="nav-link active">Sheet</a>
  </div>
</div>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="searchInput" placeholder="Search problems…" autocomplete="off">
  <select id="filterStatus">
    <option value="">All statuses</option>
    <option value="pending">Pending</option>
    <option value="attempted">Attempted</option>
    <option value="revision_needed">Revision needed</option>
    <option value="solved_with_help">Solved w/ help</option>
    <option value="completed">Completed</option>
  </select>
  <select id="filterDiff">
    <option value="">All difficulties</option>
    <option value="Easy">Easy</option>
    <option value="Medium">Medium</option>
    <option value="Hard">Hard</option>
  </select>
  <div class="filter-stats">
    <span class="filter-stat">Showing <strong id="countShown">–</strong></span>
    <span class="filter-stat">Done <strong id="countDone">–</strong></span>
  </div>
</div>

<!-- Sheet content -->
<div class="sheet-wrap" id="sheetWrap">
  <div class="empty" id="emptyState">Loading…</div>
</div>

<!-- Status popover (shared, repositioned on click) -->
<div class="status-popover" id="statusPopover"></div>

<script>
const STATUS_LABEL = {
  pending: 'Pending',
  attempted: 'Attempted',
  revision_needed: 'Revision needed',
  solved_with_help: 'Solved w/ help',
  completed: 'Completed',
};
const STATUS_DOT_COLOR = {
  pending: '#5a5955',
  attempted: '#f59e0b',
  revision_needed: '#f97316',
  solved_with_help: '#22c55e',
  completed: '#22c55e',
};
const VALID_STATUSES = ['pending', 'attempted', 'revision_needed', 'solved_with_help', 'completed'];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let allProblems = [];
// collapsed state: stepName → bool, subsKey (step+'|||'+sub) → bool
const stepCollapsed = new Set();
const subCollapsed  = new Set();

// ── Load ─────────────────────────────────────────────────────────
async function loadSheet() {
  const r = await fetch('/api/sheet');
  const data = await r.json();
  allProblems = data.problems;
  render();
}

// ── Build grouped structure ───────────────────────────────────────
function buildGroups(problems) {
  const steps = [];
  const stepMap = {};
  for (const p of problems) {
    if (!stepMap[p.step]) {
      stepMap[p.step] = { step: p.step, subs: [], subMap: {}, total: 0, done: 0 };
      steps.push(stepMap[p.step]);
    }
    const sg = stepMap[p.step];
    sg.total++;
    if (isDone(p)) sg.done++;

    const subKey = p.step + '|||' + p.subsection;
    if (!sg.subMap[subKey]) {
      sg.subMap[subKey] = { sub: p.subsection, key: subKey, items: [], total: 0, done: 0 };
      sg.subs.push(sg.subMap[subKey]);
    }
    const sub = sg.subMap[subKey];
    sub.items.push(p);
    sub.total++;
    if (isDone(p)) sub.done++;
  }
  return steps;
}

function isDone(p) { return p.status === 'completed' || p.status === 'solved_with_help'; }

// ── Render ───────────────────────────────────────────────────────
function getFiltered() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const status = document.getElementById('filterStatus').value;
  const diff   = document.getElementById('filterDiff').value;
  return allProblems.filter((p) => {
    if (status && p.status !== status) return false;
    if (diff   && p.difficulty !== diff) return false;
    if (search && !p.title.toLowerCase().includes(search) &&
                  !p.step.toLowerCase().includes(search) &&
                  !p.subsection.toLowerCase().includes(search)) return false;
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  const wrap = document.getElementById('sheetWrap');
  const empty = document.getElementById('emptyState');

  // Update counters
  document.getElementById('countShown').textContent = filtered.length.toLocaleString() + ' / ' + allProblems.length.toLocaleString();
  document.getElementById('countDone').textContent = filtered.filter(isDone).length.toLocaleString();

  if (!filtered.length) { wrap.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';

  const groups = buildGroups(filtered);
  let html = '';

  for (const sg of groups) {
    const stepOpen = !stepCollapsed.has(sg.step);
    const pct = sg.total ? Math.round((sg.done / sg.total) * 100) : 0;

    html += `<div class="step-group" data-step="${esc(sg.step)}">
      <div class="step-header${stepOpen ? ' open' : ''}" data-step="${esc(sg.step)}">
        <span class="step-chevron">
          <svg width="8" height="12" viewBox="0 0 8 12" fill="none">
            <path d="M1 1l6 5-6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="step-name">${esc(sg.step)}</span>
        <div class="step-prog-wrap">
          <div class="step-prog-bar"><div class="step-prog-fill" style="width:${pct}%"></div></div>
          <span class="step-count">${sg.done} / ${sg.total}</span>
        </div>
      </div>`;

    for (const sub of sg.subs) {
      const subKey = sub.key;
      const subOpen = !subCollapsed.has(subKey);
      const subPct = sub.total ? Math.round((sub.done / sub.total) * 100) : 0;

      html += `<div class="subsection${stepOpen ? '' : ' hidden'}" data-subkey="${esc(subKey)}">
        <div class="sub-header${subOpen ? ' open' : ''}" data-subkey="${esc(subKey)}">
          <span class="sub-chevron">
            <svg width="6" height="10" viewBox="0 0 6 10" fill="none">
              <path d="M1 1l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="sub-name">${esc(sub.sub)}</span>
          <div class="step-prog-wrap">
            <div class="sub-prog-bar"><div class="sub-prog-fill" style="width:${subPct}%"></div></div>
            <span class="sub-count">${sub.done} / ${sub.total}</span>
          </div>
        </div>
        <div class="sub-table-wrap${subOpen ? '' : ' hidden'}">
          <table>
            <thead>
              <tr class="table-header-row">
                <th style="width:48px;text-align:center">Status</th>
                <th>Problem</th>
                <th style="width:70px">Solve</th>
                <th style="width:110px">Resources</th>
                <th style="width:88px">Difficulty</th>
              </tr>
            </thead>
            <tbody>
              ${sub.items.map((p) => problemRow(p)).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }

    html += `</div>`;
  }

  wrap.innerHTML = html;
}

function problemRow(p) {
  const done = isDone(p);
  const solve = p.practiceUrl
    ? `<a class="solve-link" href="${esc(p.practiceUrl)}" target="_blank">Solve</a>`
    : `<span class="solve-dash">—</span>`;

  const res = [
    p.youtubeUrl ? `<a class="res-icon yt" href="${esc(p.youtubeUrl)}" target="_blank" title="YouTube">▶</a>` : '',
    p.url        ? `<a class="res-icon tuf" href="${esc(p.url)}"        target="_blank" title="Article">A</a>`  : '',
  ].filter(Boolean).join('') || `<span class="res-none">—</span>`;

  return `<tr data-id="${esc(p.id)}">
    <td class="td-status">
      <button class="status-btn" data-id="${esc(p.id)}" data-status="${esc(p.status)}" title="${STATUS_LABEL[p.status]}">
        ${statusIcon(p.status)}
      </button>
    </td>
    <td class="td-title">
      <span class="problem-name${done ? ' done' : ''}">${esc(p.title)}</span>
    </td>
    <td class="td-solve">${solve}</td>
    <td class="td-res"><div class="res-links">${res}</div></td>
    <td class="td-diff"><span class="diff diff-${esc(p.difficulty)}">${esc(p.difficulty)}</span></td>
  </tr>`;
}

function statusIcon(status) {
  if (status === 'completed' || status === 'solved_with_help') {
    const opacity = status === 'solved_with_help' ? 'opacity:.75' : '';
    return `<span class="status-icon ${esc(status)}" style="${opacity}">
      <span class="checkmark"></span>
    </span>`;
  }
  if (status === 'revision_needed') {
    return `<span class="status-icon revision_needed">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 1l1.12 2.27 2.5.36-1.81 1.76.43 2.49L5 6.77 2.76 7.88l.43-2.49L1.38 3.63l2.5-.36L5 1z" fill="#f97316"/>
      </svg>
    </span>`;
  }
  if (status === 'attempted') {
    return `<span class="status-icon attempted">
      <span class="att-dash"></span>
    </span>`;
  }
  // pending
  return `<span class="status-icon pending"></span>`;
}

// ── Events ───────────────────────────────────────────────────────
let activePopoverBtn = null;
const popover = document.getElementById('statusPopover');

document.getElementById('sheetWrap').addEventListener('click', (e) => {
  const stepHeader = e.target.closest('.step-header');
  if (stepHeader) {
    const step = stepHeader.dataset.step;
    if (stepCollapsed.has(step)) stepCollapsed.delete(step);
    else stepCollapsed.add(step);
    render();
    return;
  }

  const subHeader = e.target.closest('.sub-header');
  if (subHeader) {
    const key = subHeader.dataset.subkey;
    if (subCollapsed.has(key)) subCollapsed.delete(key);
    else subCollapsed.add(key);
    render();
    return;
  }

  const statusBtn = e.target.closest('.status-btn');
  if (statusBtn) {
    e.stopPropagation();
    openPopover(statusBtn);
    return;
  }
});

function openPopover(btn) {
  if (activePopoverBtn === btn) { closePopover(); return; }
  activePopoverBtn = btn;
  const currentStatus = btn.dataset.status;

  popover.innerHTML = VALID_STATUSES.map((s) => `
    <div class="status-option${s === currentStatus ? ' selected' : ''}" data-status="${s}">
      <span class="opt-dot" style="background:${STATUS_DOT_COLOR[s]}"></span>
      ${STATUS_LABEL[s]}
    </div>`).join('');

  popover.querySelectorAll('.status-option').forEach((opt) => {
    opt.addEventListener('click', async () => {
      const newStatus = opt.dataset.status;
      const id = btn.dataset.id;
      closePopover();
      await updateStatus(id, newStatus);
    });
  });

  // Position popover
  const rect = btn.getBoundingClientRect();
  popover.style.top  = (rect.bottom + 4) + 'px';
  popover.style.left = (rect.left - 60)  + 'px';
  popover.classList.add('visible');
}

function closePopover() {
  popover.classList.remove('visible');
  activePopoverBtn = null;
}

document.addEventListener('click', (e) => {
  if (!popover.contains(e.target) && !e.target.closest('.status-btn')) closePopover();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopover(); });

async function updateStatus(id, status) {
  try {
    await fetch(`/api/problems/${id}/status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    const p = allProblems.find((x) => x.id === id);
    if (p) p.status = status;
    render();
  } catch (e) {
    console.error('Failed to update status:', e);
  }
}

// ── Filters ──────────────────────────────────────────────────────
['searchInput', 'filterStatus', 'filterDiff'].forEach((id) => {
  document.getElementById(id).addEventListener('input', () => {
    // Reset collapsed state when filtering so results are visible
    const query = document.getElementById('searchInput').value.trim() ||
                  document.getElementById('filterStatus').value ||
                  document.getElementById('filterDiff').value;
    if (query) { stepCollapsed.clear(); subCollapsed.clear(); }
    render();
  });
});

loadSheet();
</script>
</body>
