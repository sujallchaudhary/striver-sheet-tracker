<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2Z Sheet — DSA Tracker</title>
<style>
  :root {
    --bg: #131312;
    --surface: #1a1a19;
    --surface-2: #222220;
    --surface-3: #2b2b29;
    --ink: #e8e7e2;
    --ink-2: #b7b5ae;
    --muted: #6b6a64;
    --border: rgba(255,255,255,0.07);
    --border-2: rgba(255,255,255,0.045);
    --accent: #f97316;
    --accent-dim: rgba(249,115,22,0.15);
    --easy: #22c55e;
    --medium: #eab308;
    --hard: #f43f5e;
    --track: #3a3a37;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 "SF Pro Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  /* ── Topbar ── */
  .topbar {
    height: 46px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-logo { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
  .topbar-logo span { color: var(--accent); }
  .topbar-sub { font-size: 12px; color: var(--muted); }
  .nav-link {
    font: 600 12px system-ui, sans-serif; color: var(--muted);
    text-decoration: none; padding: 5px 11px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.08); transition: all .15s;
  }
  .nav-link:hover { color: var(--ink); border-color: var(--muted); }
  .nav-link.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

  /* ── Progress band (matches TUF header) ── */
  .progress-band {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px;
    background: linear-gradient(180deg, #2a1510 0%, #20110d 100%);
    border-bottom: 1px solid rgba(0,0,0,.5);
  }
  .ring-wrap { position: relative; width: 62px; height: 62px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-track { stroke: rgba(255,255,255,.12); }
  .ring-fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring-inner {
    position: absolute; inset: 5px; border-radius: 50%;
    background: #171310;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
  }
  .band-main .band-label { font-size: 13.5px; color: var(--ink-2); }
  .band-main .band-count { font-size: 15px; font-weight: 700; color: #fff; margin-top: 1px; }
  .band-main .band-count span { color: var(--muted); font-weight: 500; }
  .band-diffs { margin-left: auto; display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
  .band-diff { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #fff; }
  .band-diff .dot { width: 9px; height: 9px; border-radius: 50%; }
  .band-diff b { font-weight: 700; }
  .band-diff span { color: var(--muted); font-weight: 500; }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .filter-bar input[type="search"] {
    flex: 1; min-width: 180px; max-width: 320px;
    padding: 6px 12px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.08); background: var(--surface-2);
    color: var(--ink); font: 13px system-ui, sans-serif;
  }
  .filter-bar input[type="search"]:focus { outline: none; border-color: var(--accent); }
  .filter-bar input[type="search"]::placeholder { color: var(--muted); }
  .filter-bar select {
    padding: 6px 10px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.08); background: var(--surface-2);
    color: var(--ink); font: 13px system-ui, sans-serif; cursor: pointer;
  }
  .filter-bar select:focus { outline: none; border-color: var(--accent); }
  .expand-btn {
    font: 600 12px system-ui, sans-serif; color: var(--muted); cursor: pointer;
    background: transparent; border: 1px solid rgba(255,255,255,0.08);
    padding: 5px 11px; border-radius: 7px; margin-left: auto;
  }
  .expand-btn:hover { color: var(--ink); border-color: var(--muted); }

  /* ── Scroll container ── */
  .sheet-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 60px; }
  .sheet-wrap::-webkit-scrollbar { width: 5px; }
  .sheet-wrap::-webkit-scrollbar-track { background: transparent; }
  .sheet-wrap::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; }

  /* ── Step / subsection rows (flat, like TUF) ── */
  .step-header {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 24px; cursor: pointer; user-select: none;
  }
  .step-header:hover { background: rgba(255,255,255,.025); }
  .chev {
    width: 14px; height: 14px; flex-shrink: 0; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s ease;
  }
  .open > .chev { transform: rotate(90deg); }
  .step-name { font-size: 15px; font-weight: 600; color: var(--ink); flex: 1; letter-spacing: .01em; }

  .prog-wrap { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .prog-bar { width: 110px; height: 5px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .4s ease; }
  .prog-count { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 58px; text-align: right; }
  .prog-count span { color: var(--muted); }

  .sub-header {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 24px 11px 46px; cursor: pointer; user-select: none;
  }
  .sub-header:hover { background: rgba(255,255,255,.025); }
  .sub-header .chev { width: 12px; height: 12px; }
  .sub-name { font-size: 13.5px; font-weight: 500; color: var(--ink); flex: 1; }
  .sub-header .prog-bar { width: 110px; height: 4px; }
  .sub-header .prog-count { font-size: 12.5px; }

  .hidden { display: none; }

  /* ── Problem table card ── */
  .table-card {
    margin: 4px 24px 20px 46px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 1px solid var(--border); }
  th {
    padding: 12px 14px; text-align: left;
    font-size: 12.5px; font-weight: 600; color: var(--ink-2);
    white-space: nowrap;
  }
  th.c, td.c { text-align: center; }
  tbody tr { border-bottom: 1px solid var(--border-2); transition: background .08s; }
  tbody tr:hover { background: rgba(255,255,255,.02); }
  tbody tr:last-child { border-bottom: none; }
  td { padding: 13px 14px; vertical-align: middle; }

  /* Status checkbox */
  .td-status { width: 64px; }
  .status-btn {
    width: 19px; height: 19px; border-radius: 4px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    border: 2px solid #55534e; background: transparent; padding: 0;
    transition: all .12s;
  }
  .status-btn:hover { border-color: var(--accent); }
  .status-btn.done { background: var(--accent); border-color: var(--accent); }
  .status-btn.attempted { border-color: var(--medium); }
  .status-btn.revision { border-color: var(--accent); }
  .status-btn .check {
    width: 9px; height: 6px; border-left: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translate(0.5px, -1px); display: none;
  }
  .status-btn.done .check { display: block; }
  .status-btn .dash { width: 8px; height: 2px; background: var(--medium); border-radius: 99px; display: none; }
  .status-btn.attempted .dash { display: block; }
  .status-btn.done.help { opacity: .68; }

  /* Problem name */
  .problem-name { font-size: 14px; font-weight: 450; color: var(--ink); }
  .count-badge {
    margin-left: 8px; font-size: 10.5px; font-weight: 700; color: var(--accent);
    background: var(--accent-dim); border-radius: 99px; padding: 1px 6px; vertical-align: 1px;
  }

  /* Solve link */
  .td-solve { width: 80px; }
  .solve-link { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .solve-link:hover { opacity: .75; }

  /* Resource / practice icons */
  .td-res { width: 110px; }
  .td-prac { width: 90px; }
  .res-links { display: flex; gap: 9px; align-items: center; }
  .icon-link { display: inline-flex; align-items: center; text-decoration: none; transition: opacity .15s; }
  .icon-link:hover { opacity: .75; }
  .yt-badge {
    width: 27px; height: 19px; border-radius: 4px; background: #e02f2f;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .yt-badge::after {
    content: ''; border-left: 7px solid #fff;
    border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent;
    margin-left: 1px;
  }
  .doc-icon { color: #c9c7c0; }
  .none-dash { color: var(--muted); font-size: 13px; letter-spacing: 1px; }

  /* Revision star */
  .td-rev { width: 80px; }
  .rev-btn { background: none; border: none; cursor: pointer; padding: 2px; display: inline-flex; }
  .rev-btn svg { width: 18px; height: 18px; }
  .rev-btn .star-shape { fill: none; stroke: #6b6a64; stroke-width: 1.6; transition: all .15s; }
  .rev-btn:hover .star-shape { stroke: var(--accent); }
  .rev-btn.on .star-shape { fill: var(--accent); stroke: var(--accent); }

  /* Difficulty chip */
  .td-diff { width: 96px; }
  .diff {
    display: inline-block; padding: 3px 14px; border-radius: 6px;
    font-size: 12.5px; font-weight: 600;
    background: rgba(255,255,255,.05);
  }
  .diff-Easy { color: var(--easy); }
  .diff-Medium { color: var(--medium); }
  .diff-Hard { color: var(--hard); }

  /* Status dropdown popover */
  .status-popover {
    position: fixed; z-index: 100;
    background: var(--surface-2); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.6);
    padding: 6px; min-width: 180px;
    display: none; flex-direction: column; gap: 2px;
  }
  .status-popover.visible { display: flex; }
  .status-option {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 7px; cursor: pointer;
    font-size: 13px; color: var(--ink-2); transition: background .1s;
  }
  .status-option:hover { background: var(--surface-3); color: var(--ink); }
  .status-option.selected { color: var(--ink); background: var(--surface-3); }
  .status-option .opt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .empty { padding: 80px 20px; text-align: center; color: var(--muted); }

  @media (max-width: 760px) {
    .prog-bar { width: 64px; }
    .table-card { margin-left: 24px; }
    .td-prac, th.h-prac { display: none; }
    .band-diffs { gap: 14px; }
  }
</style>
<style>
/* Match the dashboard's black glass visual system. */
:root{color-scheme:dark;--bg:#020203;--surface:rgba(13,13,17,.7);--surface-2:rgba(255,255,255,.045);--surface-3:rgba(255,255,255,.075);--ink:#f7f7fa;--ink-2:#b0b0bd;--muted:#70717e;--border:rgba(255,255,255,.085);--border-2:rgba(255,255,255,.045);--accent:#8b7cff;--accent-dim:rgba(139,124,255,.14);--track:rgba(255,255,255,.075)}
body{background:radial-gradient(circle at 10% 0,rgba(95,76,220,.11),transparent 31rem),radial-gradient(circle at 85% 65%,rgba(24,113,129,.06),transparent 35rem),#020203;background-attachment:fixed}
.topbar,.filter-bar{background:rgba(4,4,7,.72);border-color:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(24px) saturate(130%);backdrop-filter:blur(24px) saturate(130%)}
.progress-band{background:linear-gradient(135deg,rgba(20,19,29,.76),rgba(7,7,10,.62));border-bottom:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 18px 48px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.ring-inner{background:#08080b}.ring-track{stroke:rgba(255,255,255,.09)}
.nav-link,.expand-btn,.filter-bar input[type="search"],.filter-bar select{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.085);box-shadow:inset 0 1px 0 rgba(255,255,255,.025);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.table-card{background:linear-gradient(145deg,rgba(20,20,25,.7),rgba(8,8,11,.56));border-color:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 22px 55px rgba(0,0,0,.26);-webkit-backdrop-filter:blur(22px) saturate(125%);backdrop-filter:blur(22px) saturate(125%)}
.step-header:hover,.sub-header:hover,tbody tr:hover{background:rgba(255,255,255,.028)}.prog-fill{background:linear-gradient(90deg,#8b7cff,#4de3df);box-shadow:0 0 16px rgba(77,227,223,.14)}
.status-btn.done{background:var(--accent);box-shadow:0 0 16px rgba(139,124,255,.2)}
::selection{background:rgba(139,124,255,.38);color:#fff}.sheet-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">DSA <span>Tracker</span></div>
    <div class="topbar-sub">Striver A2Z</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <a href="/" class="nav-link">Dashboard</a>
    <a href="/sheet.html" class="nav-link active">Sheet</a>
  </div>
</div>

<!-- Progress band -->
<div class="progress-band">
  <div class="ring-wrap">
    <svg width="62" height="62" viewBox="0 0 62 62">
      <circle class="ring-track" cx="31" cy="31" r="27" fill="none" stroke-width="5"/>
      <circle class="ring-fill" id="ringFill" cx="31" cy="31" r="27" fill="none" stroke-width="5"
              stroke-dasharray="169.6" stroke-dashoffset="169.6"/>
    </svg>
    <div class="ring-inner" id="ringPct">–</div>
  </div>
  <div class="band-main">
    <div class="band-label">Overall Progress</div>
    <div class="band-count"><b id="bandDone">–</b> <span>/ <span id="bandTotal">–</span></span></div>
  </div>
  <div class="band-diffs">
    <div class="band-diff"><span class="dot" style="background:var(--easy)"></span> Easy&nbsp; <b id="easyDone">–</b><span>/<span id="easyTotal">–</span></span></div>
    <div class="band-diff"><span class="dot" style="background:var(--medium)"></span> Medium&nbsp; <b id="medDone">–</b><span>/<span id="medTotal">–</span></span></div>
    <div class="band-diff"><span class="dot" style="background:var(--hard)"></span> Hard&nbsp; <b id="hardDone">–</b><span>/<span id="hardTotal">–</span></span></div>
  </div>
</div>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="searchInput" placeholder="Search problems…" autocomplete="off">
  <select id="filterStatus">
    <option value="">All statuses</option>
    <option value="pending">Pending</option>
    <option value="attempted">Attempted</option>
    <option value="revision_needed">Revision needed</option>
    <option value="solved_with_help">Solved w/ help</option>
    <option value="completed">Completed</option>
  </select>
  <select id="filterDiff">
    <option value="">All difficulties</option>
    <option value="Easy">Easy</option>
    <option value="Medium">Medium</option>
    <option value="Hard">Hard</option>
  </select>
  <button class="expand-btn" id="toggleAll">Expand all</button>
</div>

<!-- Sheet content -->
<div class="sheet-wrap" id="sheetWrap"></div>
<div class="empty hidden" id="emptyState">No problems match the current filters.</div>

<!-- Status popover (shared, repositioned on click) -->
<div class="status-popover" id="statusPopover"></div>

<script>
const STATUS_LABEL = {
  pending: 'Pending',
  attempted: 'Attempted',
  revision_needed: 'Revision needed',
  solved_with_help: 'Solved w/ help',
  completed: 'Completed',
};
const STATUS_DOT_COLOR = {
  pending: '#6b6a64',
  attempted: '#eab308',
  revision_needed: '#f97316',
  solved_with_help: '#22c55e',
  completed: '#22c55e',
};
const VALID_STATUSES = ['pending', 'attempted', 'revision_needed', 'solved_with_help', 'completed'];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Revision is a flag on top of the status; flagged problems are always completed.
const isDone = (p) => p.status === 'completed' || p.status === 'solved_with_help';

let allProblems = [];

// Collapse state, persisted. Default: everything collapsed (like TUF).
const openSteps = new Set(JSON.parse(localStorage.getItem('sheetOpenSteps') || '[]'));
const openSubs  = new Set(JSON.parse(localStorage.getItem('sheetOpenSubs')  || '[]'));
function persistOpenState() {
  localStorage.setItem('sheetOpenSteps', JSON.stringify([...openSteps]));
  localStorage.setItem('sheetOpenSubs',  JSON.stringify([...openSubs]));
}

// ── Load ─────────────────────────────────────────────────────────
async function loadSheet() {
  const r = await fetch('/api/sheet');
  const data = await r.json();
  allProblems = data.problems;
  render();
}

// ── Header band ──────────────────────────────────────────────────
function renderBand() {
  const total = allProblems.length;
  const done = allProblems.filter(isDone).length;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('bandDone').textContent = done;
  document.getElementById('bandTotal').textContent = total;
  document.getElementById('ringPct').textContent = pct + '%';
  const C = 2 * Math.PI * 27;
  const ring = document.getElementById('ringFill');
  ring.setAttribute('stroke-dasharray', C.toFixed(1));
  ring.setAttribute('stroke-dashoffset', (C * (1 - pct / 100)).toFixed(1));

  for (const [diff, doneId, totalId] of [
    ['Easy', 'easyDone', 'easyTotal'], ['Medium', 'medDone', 'medTotal'], ['Hard', 'hardDone', 'hardTotal'],
  ]) {
    const ofDiff = allProblems.filter((p) => p.difficulty === diff);
    document.getElementById(doneId).textContent = ofDiff.filter(isDone).length;
    document.getElementById(totalId).textContent = ofDiff.length;
  }
}

// ── Grouping ─────────────────────────────────────────────────────
function buildGroups(problems) {
  const steps = [];
  const stepMap = {};
  for (const p of problems) {
    if (!stepMap[p.step]) {
      stepMap[p.step] = { step: p.step, subs: [], subMap: {}, total: 0, done: 0 };
      steps.push(stepMap[p.step]);
    }
    const sg = stepMap[p.step];
    sg.total++;
    if (isDone(p)) sg.done++;
    const subKey = p.step + '|||' + p.subsection;
    if (!sg.subMap[subKey]) {
      sg.subMap[subKey] = { sub: p.subsection, key: subKey, items: [], total: 0, done: 0 };
      sg.subs.push(sg.subMap[subKey]);
    }
    const sub = sg.subMap[subKey];
    sub.items.push(p);
    sub.total++;
    if (isDone(p)) sub.done++;
  }
  return steps;
}

// ── Filters ──────────────────────────────────────────────────────
function filtersActive() {
  return Boolean(
    document.getElementById('searchInput').value.trim() ||
    document.getElementById('filterStatus').value ||
    document.getElementById('filterDiff').value
  );
}
function getFiltered() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const status = document.getElementById('filterStatus').value;
  const diff = document.getElementById('filterDiff').value;
  return allProblems.filter((p) => {
    if (status === 'revision_needed') { if (!p.revision) return false; }
    else if (status && p.status !== status) return false;
    if (diff && p.difficulty !== diff) return false;
    if (search && !p.title.toLowerCase().includes(search) &&
                  !p.step.toLowerCase().includes(search) &&
                  !p.subsection.toLowerCase().includes(search)) return false;
    return true;
  });
}

// ── Render ───────────────────────────────────────────────────────
const chevSvg = `<svg viewBox="0 0 8 12" width="8" height="12" fill="none">
  <path d="M1.5 1.5l5 4.5-5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function progHtml(done, total, sub) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  return `<div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <span class="prog-count">${done} <span>/ ${total}</span></span>
  </div>`;
}

function render() {
  renderBand();
  const filtered = getFiltered();
  const wrap = document.getElementById('sheetWrap');
  const empty = document.getElementById('emptyState');
  const showAll = filtersActive(); // searching → expand everything so results are visible

  empty.classList.toggle('hidden', filtered.length > 0);
  if (!filtered.length) { wrap.innerHTML = ''; return; }

  let html = '';
  for (const sg of buildGroups(filtered)) {
    const stepOpen = showAll || openSteps.has(sg.step);
    html += `<div class="step-header${stepOpen ? ' open' : ''}" data-step="${esc(sg.step)}">
      <span class="chev">${chevSvg}</span>
      <span class="step-name">${esc(sg.step)}</span>
      ${progHtml(sg.done, sg.total)}
    </div>`;

    for (const sub of sg.subs) {
      const subOpen = showAll || openSubs.has(sub.key);
      html += `<div class="${stepOpen ? '' : 'hidden'}">
        <div class="sub-header${subOpen ? ' open' : ''}" data-subkey="${esc(sub.key)}">
          <span class="chev">${chevSvg}</span>
          <span class="sub-name">${esc(sub.sub)}</span>
          ${progHtml(sub.done, sub.total)}
        </div>
        <div class="table-card${subOpen ? '' : ' hidden'}">
          <table>
            <thead>
              <tr>
                <th class="c" style="width:64px">Status</th>
                <th>Problem</th>
                <th style="width:80px">Solve</th>
                <th style="width:110px">Resource</th>
                <th class="h-prac" style="width:90px">Practice</th>
                <th class="c" style="width:80px">Revision</th>
                <th style="width:96px">Difficulty</th>
              </tr>
            </thead>
            <tbody>${sub.items.map(problemRow).join('')}</tbody>
          </table>
        </div>
      </div>`;
    }
  }
  wrap.innerHTML = html;
}

function problemRow(p) {
  const done = isDone(p);
  const btnClass =
    done ? 'done' + (p.status === 'solved_with_help' ? ' help' : '') :
    p.status === 'attempted' ? 'attempted' : '';
  const countBadge = (p.completionCount || 0) > 1
    ? `<span class="count-badge" title="Completed ${p.completionCount} times">×${p.completionCount}</span>` : '';

  const solve = p.url
    ? `<a class="solve-link" href="${esc(p.url)}" target="_blank">Solve</a>`
    : `<span class="none-dash">---</span>`;

  const res = [
    p.url ? `<a class="icon-link doc-icon" href="${esc(p.url)}" target="_blank" title="Article">
        <svg width="15" height="17" viewBox="0 0 15 17" fill="none">
          <path d="M2 1h7l4 4v11H2V1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M9 1v4h4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M4.5 8.5h6M4.5 11h6M4.5 13.5h4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg></a>` : '',
    p.youtubeUrl ? `<a class="icon-link" href="${esc(p.youtubeUrl)}" target="_blank" title="YouTube"><span class="yt-badge"></span></a>` : '',
  ].filter(Boolean).join('') || `<span class="none-dash">---</span>`;

  const practice = p.practiceUrl
    ? `<a class="solve-link" href="${esc(p.practiceUrl)}" target="_blank">Link</a>`
    : `<span class="none-dash">---</span>`;

  return `<tr data-id="${esc(p.id)}">
    <td class="td-status c">
      <button class="status-btn ${btnClass}" data-id="${esc(p.id)}" data-status="${esc(p.status)}" title="${STATUS_LABEL[p.status]}">
        <span class="check"></span><span class="dash"></span>
      </button>
    </td>
    <td><span class="problem-name">${esc(p.title)}</span>${countBadge}</td>
    <td class="td-solve">${solve}</td>
    <td class="td-res"><div class="res-links">${res}</div></td>
    <td class="td-prac">${practice}</td>
    <td class="td-rev c">
      <button class="rev-btn${p.revision ? ' on' : ''}" data-id="${esc(p.id)}" data-rev="${p.revision ? '1' : ''}"
              title="${p.revision ? 'In revision — click to unflag' : 'Flag for revision (marks completed)'}">
        <svg viewBox="0 0 24 24"><path class="star-shape" d="M12 2.5l2.9 5.9 6.5.95-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.05 1.1-6.5-4.7-4.6 6.5-.95L12 2.5z"/></svg>
      </button>
    </td>
    <td class="td-diff"><span class="diff diff-${esc(p.difficulty)}">${esc(p.difficulty)}</span></td>
  </tr>`;
}

// ── Events ───────────────────────────────────────────────────────
let activePopoverBtn = null;
const popover = document.getElementById('statusPopover');

document.getElementById('sheetWrap').addEventListener('click', (e) => {
  const statusBtn = e.target.closest('.status-btn');
  if (statusBtn) { openPopover(statusBtn); return; }

  const revBtn = e.target.closest('.rev-btn');
  if (revBtn) {
    toggleRevision(revBtn.dataset.id, !revBtn.dataset.rev);
    return;
  }

  const stepHeader = e.target.closest('.step-header');
  if (stepHeader) {
    const step = stepHeader.dataset.step;
    openSteps.has(step) ? openSteps.delete(step) : openSteps.add(step);
    persistOpenState();
    render();
    return;
  }

  const subHeader = e.target.closest('.sub-header');
  if (subHeader) {
    const key = subHeader.dataset.subkey;
    openSubs.has(key) ? openSubs.delete(key) : openSubs.add(key);
    persistOpenState();
    render();
  }
});

// Expand / collapse all
document.getElementById('toggleAll').addEventListener('click', (e) => {
  const anyOpen = openSteps.size > 0;
  openSteps.clear(); openSubs.clear();
  if (!anyOpen) {
    for (const p of allProblems) { openSteps.add(p.step); openSubs.add(p.step + '|||' + p.subsection); }
  }
  e.target.textContent = anyOpen ? 'Expand all' : 'Collapse all';
  persistOpenState();
  render();
});

function openPopover(btn) {
  if (activePopoverBtn === btn) { closePopover(); return; }
  activePopoverBtn = btn;
  const currentStatus = btn.dataset.status;

  popover.innerHTML = VALID_STATUSES.map((s) => `
    <div class="status-option${s === currentStatus ? ' selected' : ''}" data-status="${s}">
      <span class="opt-dot" style="background:${STATUS_DOT_COLOR[s]}"></span>
      ${STATUS_LABEL[s]}
    </div>`).join('');

  popover.querySelectorAll('.status-option').forEach((opt) => {
    opt.addEventListener('click', () => {
      const id = btn.dataset.id;
      const status = opt.dataset.status;
      closePopover();
      updateStatus(id, status);
    });
  });

  const rect = btn.getBoundingClientRect();
  popover.classList.add('visible');
  const ph = popover.offsetHeight;
  const top = rect.bottom + 4 + ph > window.innerHeight ? rect.top - ph - 4 : rect.bottom + 4;
  popover.style.top = top + 'px';
  popover.style.left = Math.max(8, rect.left - 60) + 'px';
}

function closePopover() {
  popover.classList.remove('visible');
  activePopoverBtn = null;
}
document.addEventListener('click', (e) => {
  if (!popover.contains(e.target) && !e.target.closest('.status-btn')) closePopover();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopover(); });

async function updateStatus(id, status) {
  try {
    const r = await fetch(`/api/problems/${id}/status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    if (!r.ok) throw new Error(await r.text());
    await refreshProblem(id);
  } catch (e) {
    console.error('Failed to update status:', e);
  }
}

async function toggleRevision(id, on) {
  try {
    const r = await fetch(`/api/problems/${id}/revision`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ revision: on }),
    });
    if (!r.ok) throw new Error(await r.text());
    await refreshProblem(id);
  } catch (e) {
    console.error('Failed to toggle revision:', e);
  }
}

// Re-fetch the canonical problem state (status, revision flag, completion count)
// so local state matches the server's rules (e.g. flag → auto-complete).
async function refreshProblem(id) {
  const list = await (await fetch('/api/problems')).json();
  const fresh = list.find((x) => x.id === id);
  const p = allProblems.find((x) => x.id === id);
  if (p && fresh) Object.assign(p, fresh);
  render();
}

['searchInput', 'filterStatus', 'filterDiff'].forEach((id) => {
  document.getElementById(id).addEventListener('input', render);
});

loadSheet();
</script>
